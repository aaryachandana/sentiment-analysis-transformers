[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis-transformers"
version = "1.0.0"
description = "Transformer-based sentiment analysis with a Streamlit demo."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
